[package]
name = "stateset-ucp-python"
version = "0.1.0"
edition = "2021"
description = "Python bindings for the Stateset UCP Handler"
license = "BUSL-1.1"
repository = "https://github.com/stateset/stateset-ucp-handler"

[lib]
name = "stateset_ucp"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stateset_ucp_lib = { path = "../..", package = "stateset-ucp-handler" }

[workspace]
