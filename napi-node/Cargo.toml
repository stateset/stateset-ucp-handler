[package]
name = "stateset-ucp-node"
version = "0.1.0"
edition = "2021"
description = "Native Node.js bindings for the Stateset UCP Handler"
license = "BUSL-1.1"
repository = "https://github.com/stateset/stateset-ucp-handler"
authors = ["Stateset <support@stateset.com>"]

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["async", "tokio_rt", "serde-json", "napi6"] }
napi-derive = "2"
stateset_ucp_lib = { path = "..", package = "stateset-ucp-handler" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
napi-build = "2"
