syntax = "proto3";

package ucp_handler.v1;

service UcpHandler {
  rpc CreateCheckoutSession(CheckoutCreateRequest) returns (CheckoutResponse);
  rpc GetCheckoutSession(CheckoutGetRequest) returns (CheckoutResponse);
  rpc UpdateCheckoutSession(CheckoutUpdateRequest) returns (CheckoutResponse);
  rpc CompleteCheckoutSession(CheckoutCompleteRequest) returns (CheckoutResponse);
  rpc CancelCheckoutSession(CheckoutCancelRequest) returns (CheckoutResponse);
  rpc Tokenize(TokenizeRequest) returns (TokenizeResponse);
  rpc Detokenize(DetokenizeRequest) returns (DetokenizeResponse);
}

message CheckoutCreateRequest {
  bytes payload_json = 1;
}

message CheckoutUpdateRequest {
  string id = 1;
  bytes payload_json = 2;
}

message CheckoutCompleteRequest {
  string id = 1;
  bytes payload_json = 2;
}

message CheckoutGetRequest {
  string id = 1;
}

message CheckoutCancelRequest {
  string id = 1;
}

message CheckoutResponse {
  bytes payload_json = 1;
}

message TokenizeRequest {
  bytes payload_json = 1;
}

message TokenizeResponse {
  bytes payload_json = 1;
}

message DetokenizeRequest {
  bytes payload_json = 1;
}

message DetokenizeResponse {
  bytes payload_json = 1;
}
